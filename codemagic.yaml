# ============================================================
# Codemagic iOS 打包配置 —— 汇语/Hchat（Flutter 1.4.9+30）
# 签名方式：手动签名（证书与描述文件在仓库 ios/certs/ 内，
# 团队 B25PNZ7JHS，Bundle ID app.aries542.labradorite9152）
# ============================================================
workflows:
  ios-ipa:
    name: iOS IPA (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        CERT_PASSWORD: "1"

    scripts:
      - name: 导入证书与描述文件（手动签名）
        script: |
          set -e
          keychain initialize
          # 导入分发证书
          keychain add-certificates --certificate $CM_BUILD_DIR/ios/certs/distribution.p12 --certificate-password $CERT_PASSWORD
          # 安装 Ad Hoc 描述文件
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp $CM_BUILD_DIR/ios/certs/adhoc.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/
          # 让工程使用该描述文件（按 bundle id 匹配并写入签名配置）
          xcode-project use-profiles

      - name: Flutter 依赖安装（关闭 SPM，回退 CocoaPods 模式）
        script: |
          flutter config --no-enable-swift-package-manager
          flutter packages pub get

      - name: 编译并导出 IPA
        script: |
          flutter build ipa --release --export-method ad-hoc

    artifacts:
      - build/ios/ipa/*.ipa
